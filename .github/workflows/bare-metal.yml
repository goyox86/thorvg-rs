name: Bare-metal

# Exercises the no_std + picolibc path in build.rs by cross-compiling for
# a bare-metal RISC-V target. The ESP32-C6 / Xtensa path needs the esp
# toolchain (export-esp.sh) and is validated locally, not here.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "thorvg-sys/**"
      - "thorvg/**"
      - ".github/workflows/bare-metal.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  riscv-none:
    name: riscv32imac-unknown-none-elf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # thorvg + picolibc
      - name: Install libclang (for host bindgen)
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang
      # ThorVG is C++ and needs libstdc++ headers even on bare metal.
      # build.rs's picolibc header isolation is tuned to Espressif's
      # riscv32-esp-elf toolchain (the one documented in thorvg-sys/README),
      # so use it rather than a generic bare-metal GCC.
      - name: Install riscv32-esp-elf toolchain (Espressif)
        run: |
          # Pinned crosstool-NG release. A direct asset download avoids the
          # GitHub API: unauthenticated `releases/latest` is rate-limited
          # (HTTP 403) on shared Actions runner IPs, which left the URL
          # empty and failed the build. Pinning is also reproducible and
          # matches the toolchain thorvg-sys is validated against locally.
          ver="esp-14.2.0_20241119"
          url="https://github.com/espressif/crosstool-NG/releases/download/${ver}/riscv32-esp-elf-${ver#esp-}-x86_64-linux-gnu.tar.xz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/riscv-esp.tar.xz
          sudo mkdir -p /opt/esp
          sudo tar -xf /tmp/riscv-esp.tar.xz -C /opt/esp
          echo "/opt/esp/riscv32-esp-elf/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      # std-gated features (std, threads, file-io) stay off on bare metal.
      # build.rs honours the cc CC_/CXX_<triple> contract to pick the
      # cross compiler (no vendor binary name is hardcoded).
      - name: Build (no_std + picolibc)
        env:
          CC_riscv32imac_unknown_none_elf: riscv32-esp-elf-gcc
          CXX_riscv32imac_unknown_none_elf: riscv32-esp-elf-g++
        run: >
          cargo build -p thorvg
          --target riscv32imac-unknown-none-elf
          --no-default-features
          --features vendored,lottie,svg,png,fonts

  # Regression guard for the crates.io package `include` allowlist.
  # The job above builds the workspace tree, which has the full picolibc
  # submodule on disk — so it CANNOT catch files missing from the packaged
  # crate (this is how 0.3.2's picolibc omission shipped). Here we
  # `cargo package` thorvg-sys and build the resulting tarball for bare
  # metal, exercising the include list against `target_os = "none"`.
  packaged-riscv-none:
    name: packaged crate → riscv32imac-unknown-none-elf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # thorvg + picolibc
      - name: Install libclang (for host bindgen)
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang
      - name: Install riscv32-esp-elf toolchain (Espressif)
        run: |
          # Pinned crosstool-NG release. A direct asset download avoids the
          # GitHub API: unauthenticated `releases/latest` is rate-limited
          # (HTTP 403) on shared Actions runner IPs, which left the URL
          # empty and failed the build. Pinning is also reproducible and
          # matches the toolchain thorvg-sys is validated against locally.
          ver="esp-14.2.0_20241119"
          url="https://github.com/espressif/crosstool-NG/releases/download/${ver}/riscv32-esp-elf-${ver#esp-}-x86_64-linux-gnu.tar.xz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/riscv-esp.tar.xz
          sudo mkdir -p /opt/esp
          sudo tar -xf /tmp/riscv-esp.tar.xz -C /opt/esp
          echo "/opt/esp/riscv32-esp-elf/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      # `--no-verify` skips the redundant host verify build; we want the
      # bare-metal build below, which is what actually exercises picolibc.
      - name: Package thorvg-sys
        run: cargo package -p thorvg-sys --no-verify --allow-dirty
      - name: Build the packaged crate (no_std + picolibc)
        env:
          CC_riscv32imac_unknown_none_elf: riscv32-esp-elf-gcc
          CXX_riscv32imac_unknown_none_elf: riscv32-esp-elf-g++
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name 'thorvg-sys-*.crate' | head -1)
          echo "Extracting $crate"
          # Extract OUTSIDE the workspace: a crate unpacked under the repo
          # is treated as a workspace member and won't build standalone.
          tar -xf "$crate" -C "$RUNNER_TEMP"
          dir=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'thorvg-sys-*' | head -1)
          echo "Building packaged crate at $dir for bare metal"
          cargo build --manifest-path "$dir/Cargo.toml" \
            --target riscv32imac-unknown-none-elf \
            --no-default-features \
            --features vendored,lottie,svg,png,fonts
