[package]
name = "thorvg-sys"
# Crate-owned SemVer, decoupled from upstream. The bundled ThorVG C++
# release is recorded as build metadata (`+thorvg-X.Y.Z`); it is not the
# crate version. 0.x: a minor bump is breaking, so the safe `thorvg`
# crate's dependency moves in lockstep.
version = "0.3.2+thorvg-1.1.0"
edition = "2024"
license = "MIT"
description = "Raw FFI bindings to the ThorVG vector graphics library"
readme = "README.md"
repository = "https://github.com/goyox86/thorvg-rs"
homepage = "https://github.com/goyox86/thorvg-rs"
documentation = "https://docs.rs/thorvg-sys"
categories = ["external-ffi-bindings", "graphics", "rendering"]
keywords = ["thorvg", "vector-graphics", "svg", "lottie", "ffi"]
links = "thorvg"
include = [
    "/LICENSE",
    "/CHANGELOG.md",
    "/build.rs",
    "/src/",
    # Vendored ThorVG: source, headers, build files, and licenses
    "thorvg/LICENSE",
    "thorvg/inc/**",
    "thorvg/**/*.cpp",
    "thorvg/**/*.h",
    "thorvg/**/*.c",
    "thorvg/**/LICENSE",
    # Vendored picolibc (bare-metal libc for `target_os = "none"` builds).
    # Without these the crates.io package omits picolibc entirely and any
    # bare-metal build fails in build.rs (host/system builds don't use it).
    # Include whole `libc/` + `libm/` trees rather than enumerate
    # extensions: picolibc sources `#include` `.h`, `.c`, `.t`, and `.cat`
    # table files, and `libc/` headers reach into `libm/` (e.g.
    # `stdio/dtoa.h` -> `../../libm/common/math_config.h`). build.rs
    # compiles only `libc/` subtrees but needs `libm/` headers on the
    # include path. The 28 MB `test/` tree is intentionally excluded.
    "picolibc/COPYING.picolibc",
    "picolibc/libc/**",
    "picolibc/libm/**",
    "picolibc-config/**",
]

[features]
default = ["vendored", "lottie", "svg", "png", "fonts", "expressions", "threads", "file-io"]
vendored = []

# ── Loader features ──────────────────────────────────────────────
# Each loader adds the corresponding ThorVG source files and config
# define.  Disable defaults and pick what you need for embedded.
lottie      = []   # Lottie animation loader
svg         = []   # SVG loader
png         = []   # Built-in PNG loader (lodepng, no system dep)
fonts       = []   # SFNT / OTF / TTF font loaders

# ── Optional capabilities ────────────────────────────────────────
expressions = []   # Lottie expressions via JerryScript (~200 KB RAM)
threads     = []   # Multi-threaded TaskScheduler (std::thread)
file-io     = []   # Filesystem I/O APIs (Picture::load, etc.)

[build-dependencies]
bindgen = "0.71"
cc = "1"
pkg-config = "0.3"
